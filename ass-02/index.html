<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox Quest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="game-header">

        <h1>Flexbox Game</h1>

        <div class="game-info">
            <span>Lives: 3</span>
            <span>Coins: 120</span>
            <span>Level: 1</span>
        </div>

        <div class="header-buttons">
            <button>Pause</button>
            <button>Menu</button>
        </div>

    </header>


    <!-- MAIN -->
    <main>

        <!-- GAME AREA -->
        <section class="game-area">

            <div class="star">STAR</div>

            <div class="player">PLAYER</div>

            <div class="platform">PLATFORM 1</div>

            <div class="platform">PLATFORM 2</div>

        </section>


        <!-- GAME PANELS -->
        <section class="game-panels">

            <!-- CONTROLS -->
            <div class="panel controls">

                <h2>Controls</h2>

                <div class="control-row">
                    <button>↑</button>
                </div>

                <div class="control-row">
                    <button>←</button>
                    <button>↓</button>
                    <button>→</button>
                </div>

                <button class="jump">Jump</button>

            </div>


            <!-- INVENTORY -->
            <div class="panel inventory">

                <h2>Inventory</h2>

                <div class="inventory-items">
                    <div class="item">Sword</div>
                    <div class="item">Shield</div>
                    <div class="item">Potion</div>
                    <div class="item">Key</div>
                </div>

            </div>


            <!-- QUEST -->
            <div class="panel quest">

                <h2>Quest</h2>

                <div class="quest-item">
                    <span>Collect 3 Stars</span>
                    <span>1 / 3</span>
                </div>

                <div class="quest-item">
                    <span>Find the Golden Key</span>
                    <span>0 / 1</span>
                </div>

                <div class="quest-item">
                    <span>Defeat the Monster</span>
                    <span>0 / 1</span>
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 Flexbox Quest. All Rights Reserved.</p>
    </footer>

</body>

</html>
